# Dependabot configuration for Woningradar.
# Checks weekly for updates to the Python runtime and dev requirements, the
# base Docker image, and the GitHub Actions used by the workflows. Minor and
# patch bumps are grouped into a single pull request per ecosystem to keep
# review noise down; major bumps stay separate so they get proper attention.

version: 2

updates:
  # Runtime dependencies (app/requirements.txt)
  - package-ecosystem: pip
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Development and CI dependencies (requirements-dev.txt at the repo root)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps-dev)"
    groups:
      dev-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
