name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Requests that lower scrape
        intervals below the current defaults, or that add bot-detection evasion,
        captcha solving, or rate-limit bypassing, will be closed —
        see [Ethical scraping](../blob/main/CONTRIBUTING.md#ethical-scraping).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I have searched the existing open and closed issues and this is not a duplicate.
          required: true
        - label: I have read the Ethical scraping section of CONTRIBUTING.md and this request does not conflict with it.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the concrete situation you are stuck in. Focus on the problem,
        not on a particular implementation.
      placeholder: I want to track listings in two municipalities, but LOCATION accepts only one value.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Woningradar do? Include new env vars, CLI flags or config keys if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you prefer the one above. "None" is a valid answer.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - New scraper for an additional site
        - Existing scraper (Funda / Huispedia / Pararius)
        - Kanboard integration / task formatting
        - Configuration and search criteria
        - Notifications / alternative outputs
        - Docker / deployment / operator CLI
        - Observability (logging, health, metrics)
        - Documentation
        - Tests / CI
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Expected scope and impact
      options:
        - Small — additive, backwards compatible
        - Medium — new configuration surface, still backwards compatible
        - Large — architectural change
        - Breaking — changes existing behaviour, env vars, or defaults
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact on existing users
      description: |
        Does this change defaults, require new env vars, or require a migration?
        Note anything that would need a `.env.example` or CHANGELOG entry.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
          required: true
